<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a{
            /* 將超連結轉成區塊 */
            display: block;

            /* 設定寬度 */
            width: 260PX;

             /* 設定高度 */
             height: 65PX;

             /* 設定文字置中 */
             text-align:center;

            /* 設定行高等於高度，則文字會自動置中 */
            line-height: 65px;

            /* 取消超連結的底線 */
            text-decoration: none;

            /* 設定文字顏色 */
            color: #ffffff;

            /* 設定背景圖片 */
            background-image:url(./menu1/icon01.png);
        }
        
        /* 碰到超連結時改變底色 */
        a:hover{
           background-image:url(./menu1/icon02.png);           
        }

    </style>

</head>
<body>
    <h1>選單製作</h1>
    <!--超連結是行內標籤，沒有寬高，若要設定寬高，則要轉成區塊-->
    <p><a href="#">關於我們</a></p>
    <p><a href="#">最新消息</a></p>
    <p><a href="#">產品介紹</a></p>
    <p><a href="#">線上訂購</a></p>

    
</body>
</html>
